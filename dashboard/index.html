<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>SMMA Screener</title>
  <style>
    body {
      background: #0b0e14;
      color: #e2e8f0;
      font-family: monospace;
      padding: 20px;
      font-size: 12px;
    }
    h1 { color: #00d4aa; margin-bottom: 6px; }
    h2 { color: #00d4aa; margin-top: 30px; margin-bottom: 10px; }
    .status { font-size: 12px; color: #718096; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    th {
      background: #181d28;
      padding: 8px 10px;
      text-align: left;
      color: #718096;
      font-size: 10px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    td {
      padding: 8px 10px;
      border-bottom: 1px solid #1e2535;
      white-space: nowrap;
    }
    tr:hover { background: #181d28; }
    .buy    { color: #00d4aa; font-weight: bold; }
    .sell   { color: #ff4d6a; font-weight: bold; }
    .accept { color: #00d4aa; font-weight: bold; }
    .avoid  { color: #ff4d6a; font-weight: bold; }
    .dim    { color: #4a5568; }
    .reason {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #718096;
    }
    .pnl-summary {
      background: #181d28;
      padding: 12px 16px;
      border-radius: 6px;
      margin: 20px 0 10px 0;
      font-size: 13px;
      color: #718096;
    }
  </style>
</head>
<body>
  <h1>SMMA Screener — Live</h1>
  <div class="status" id="status">Connecting...</div>

  <!-- Live Screener Table -->
  <table>
    <thead>
      <tr>
        <th>Symbol</th>
        <th>LTP ₹</th>
        <th>Bid ₹</th>
        <th>Bid Qty</th>
        <th>Ask ₹</th>
        <th>Ask Qty</th>
        <th>SMMA(20)</th>
        <th>SMMA(120)</th>
        <th>ETQ 5m</th>
        <th>ETQ 20m</th>
        <th>ETQ 60m</th>
        <th>Avg LTP 20m</th>
        <th>Avg LTP 60m</th>
        <th>Signal</th>
        <th>ML Verdict</th>
        <th>Confidence</th>
        <th>Reason</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <!-- P&L Summary -->
  <div class="pnl-summary" id="pnl-summary">
    Loading P&L summary...
  </div>

  <!-- Signal History Table -->
  <h2>Signal History</h2>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Symbol</th>
        <th>Signal</th>
        <th>Entry ₹</th>
        <th>Exit ₹</th>
        <th>P&L ₹</th>
        <th>Result</th>
        <th>ML Verdict</th>
        <th>Confidence</th>
      </tr>
    </thead>
    <tbody id="signal-tbody"></tbody>
  </table>

<script>
  // ── WebSocket for live screener ────────────────────────────
  const ws = new WebSocket("ws://127.0.0.1:8765");

  ws.onopen = () => {
    document.getElementById("status").innerHTML = "🟢 Live";
  };

  ws.onmessage = (event) => {
    const rows = JSON.parse(event.data);
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    rows.forEach(r => {
      const sigClass = r.signal === "BUY"  ? "buy"
                     : r.signal === "SELL" ? "sell" : "dim";
      const mlClass  = r.ml_verdict === "ACCEPT" ? "accept"
                     : r.ml_verdict === "AVOID"  ? "avoid" : "dim";

      tbody.innerHTML += `<tr>
        <td><b>${r.symbol}</b></td>
        <td>${r.ltp ?? "—"}</td>
        <td>${r.bid_price ?? "—"}</td>
        <td>${(r.bid_qty ?? 0).toLocaleString()}</td>
        <td>${r.ask_price ?? "—"}</td>
        <td>${(r.ask_qty ?? 0).toLocaleString()}</td>
        <td>${r.smma_fast ?? "—"}</td>
        <td>${r.smma_slow ?? "—"}</td>
        <td>${(r.etq_5m ?? 0).toLocaleString()}</td>
        <td>${(r.etq_20m ?? 0).toLocaleString()}</td>
        <td>${(r.etq_60m ?? 0).toLocaleString()}</td>
        <td>${r.avg_ltp_20m ?? "—"}</td>
        <td>${r.avg_ltp_60m ?? "—"}</td>
        <td class="${sigClass}">${r.signal ?? "—"}</td>
        <td class="${mlClass}">${r.ml_verdict ?? "—"}</td>
        <td>${r.ml_conf ?? "—"}</td>
        <td class="reason" title="${r.ml_reason ?? ""}">${r.ml_reason ?? "—"}</td>
      </tr>`;
    });
  };

  ws.onclose = () => {
    document.getElementById("status").innerHTML = "🔴 Disconnected";
    setTimeout(() => location.reload(), 3000);
  };

  // ── Signal history + P&L summary ──────────────────────────
  async function loadSignals() {
    try {
      const resp    = await fetch("/api/signals");
      const signals = await resp.json();
      const tbody   = document.getElementById("signal-tbody");
      tbody.innerHTML = "";

      // P&L summary
      const closed   = signals.filter(s => s.pnl !== null);
      const wins     = closed.filter(s => s.profitable === 1).length;
      const losses   = closed.filter(s => s.profitable === 0).length;
      const open     = signals.filter(s => s.pnl === null).length;
      const totalPnl = closed.reduce((sum, s) => sum + s.pnl, 0);
      const winRate  = closed.length > 0
                     ? ((wins / closed.length) * 100).toFixed(1)
                     : 0;

      document.getElementById("pnl-summary").innerHTML = `
        Total Signals: <b>${signals.length}</b> &nbsp;|&nbsp;
        Closed: <b>${closed.length}</b> &nbsp;|&nbsp;
        Open: <b>${open}</b> &nbsp;|&nbsp;
        Wins: <span class="buy"><b>${wins}</b></span> &nbsp;|&nbsp;
        Losses: <span class="sell"><b>${losses}</b></span> &nbsp;|&nbsp;
        Win Rate: <b>${winRate}%</b> &nbsp;|&nbsp;
        Total P&L: <span class="${totalPnl >= 0 ? 'buy' : 'sell'}">
        <b>₹${totalPnl.toFixed(2)}</b></span>
      `;

      // Signal rows
      signals.forEach(s => {
        const pnlClass = s.pnl === null   ? ""
                       : s.pnl >= 0       ? "buy" : "sell";
        const result   = s.profitable === 1 ? "✅ WIN"
                       : s.profitable === 0 ? "❌ LOSS" : "⏳ Open";
        const sigClass = s.signal === "BUY" ? "buy" : "sell";
        const mlClass  = s.predicted === "ACCEPT" ? "accept" : "avoid";
        const conf     = s.confidence !== null
                       ? (s.confidence * 100).toFixed(0) + "%" : "—";

        tbody.innerHTML += `<tr>
          <td>${s.timestamp}</td>
          <td><b>${s.symbol}</b></td>
          <td class="${sigClass}">${s.signal}</td>
          <td>${s.entry_ltp}</td>
          <td>${s.exit_ltp ?? "—"}</td>
          <td class="${pnlClass}">${s.pnl !== null ? s.pnl.toFixed(2) : "—"}</td>
          <td>${result}</td>
          <td class="${mlClass}">${s.predicted ?? "—"}</td>
          <td>${conf}</td>
        </tr>`;
      });

    } catch(e) {
      console.error("Signal fetch error:", e);
    }
  }

  setInterval(loadSignals, 5000);
  loadSignals();
</script>
</body>
</html>
